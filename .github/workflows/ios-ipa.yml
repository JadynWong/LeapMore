name: iOS IPA

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 30
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Install build dependencies
        run: |
          npm install --global pnpm@11.29.0
          pnpm install --frozen-lockfile
          gem install --user-install xcodeproj --no-document
      - run: pnpm package:ios
      - uses: actions/upload-artifact@v4
        with:
          name: LeapMore-iOS
          path: app/ios/build/LeapMore-v*-ios.ipa
          if-no-files-found: error
