name: iOS unsigned IPA

on:
  push:
    branches: [ios-livecontainer]

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 30
    defaults:
      run:
        working-directory: app

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Install build dependencies
        run: |
          npm install --global pnpm@11.29.0
          pnpm install --frozen-lockfile
          gem install --user-install xcodeproj --no-document
      - name: Generate the Capacitor iOS project
        run: pnpm native:ios
      - name: Build for iPhone without signing
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App \
            -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/leapmore-ios" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build
      - name: Package and verify the IPA
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          mkdir Payload
          ditto leapmore-ios/Build/Products/Release-iphoneos/App.app Payload/App.app
          app=Payload/App.app
          widget_name=$(/usr/libexec/PlistBuddy -c 'Print CFBundleName' "$app/PlugIns/LeapWidget.appex/Info.plist")
          if [[ -z "$widget_name" ]]; then
            echo "::error::LeapWidget extension has an empty CFBundleName"
            exit 1
          fi
          executable=$(/usr/libexec/PlistBuddy -c 'Print CFBundleExecutable' "$app/Info.plist")
          lipo "$app/$executable" -verify_arch arm64
          xcrun vtool -arch arm64 -show-build "$app/$executable" | grep -Eq 'platform[[:space:]]+IOS$'
          while IFS= read -r -d '' file; do
            if codesign --display "$file" >/dev/null 2>&1; then
              codesign --remove-signature "$file"
            fi
          done < <(find "$app" -type f -print0)
          test ! -e "$app/embedded.mobileprovision"
          ditto -c -k --keepParent Payload LeapMore-iOS-unsigned.ipa
          unzip -tq LeapMore-iOS-unsigned.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: LeapMore-iOS-unsigned
          path: ${{ runner.temp }}/LeapMore-iOS-unsigned.ipa
          if-no-files-found: error
      - name: Preserve App Group entitlements for SideStore
        run: |
          set -euo pipefail
          project="$PWD/ios/App"
          cd "$RUNNER_TEMP"
          app=Payload/App.app
          widget="$app/PlugIns/LeapWidget.appex"
          shopt -s nullglob
          for framework in "$app"/Frameworks/*.framework; do
            codesign --force --sign - "$framework"
          done
          for library in "$app"/Frameworks/*.dylib; do
            codesign --force --sign - "$library"
          done
          codesign --force --sign - --entitlements "$project/LeapWidget/LeapWidget.entitlements" "$widget"
          codesign --force --sign - --entitlements "$project/App/LeapMore.entitlements" "$app"
          codesign --verify --deep --strict "$app"
          for bundle in "$app" "$widget"; do
            codesign --display --xml --entitlements - "$bundle" > leapmore-entitlements.plist
            group=$(/usr/libexec/PlistBuddy -c 'Print :com.apple.security.application-groups:0' leapmore-entitlements.plist)
            test "$group" = group.com.leapmore.app
          done
          ditto -c -k --keepParent Payload LeapMore-iOS-SideStore.ipa
          unzip -tq LeapMore-iOS-SideStore.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: LeapMore-iOS-SideStore
          path: ${{ runner.temp }}/LeapMore-iOS-SideStore.ipa
          if-no-files-found: error
